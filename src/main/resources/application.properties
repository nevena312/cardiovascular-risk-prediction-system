spring.application.name=cardiovascular-risk-app

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cardiovascular_risk}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

cardiovascular.model.path=${MODEL_PATH:models/deepnetts_cardiovascular_model.dnet}
cardiovascular.scaler.path=${SCALER_PATH:models/age_scaler.txt}
cardiovascular.prediction.threshold=0.5
cardiovascular.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=${SERVER_PORT:8080}
